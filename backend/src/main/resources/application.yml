spring:
  application:
    name: revivex
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@localhost:1521:xe}
    username: ${DB_USERNAME:system}
    password: ${DB_PASSWORD:Password}
    driver-class-name: ${DB_DRIVER:oracle.jdbc.OracleDriver}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET:8a4b3d7c5f891e4b9d0f2a4c8e7b3d1f8a4b3d7c5f891e4b9d0f2a4c8e7b3d1f}
  expiration: 86400000

razorpay:
  key-id: ${RAZORPAY_KEY_ID:rzp_test_mock_id}
  key-secret: ${RAZORPAY_KEY_SECRET:mock_secret}

server:
  port: 8080
