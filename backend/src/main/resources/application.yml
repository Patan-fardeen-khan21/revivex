spring:
  application:
    name: revivex
  datasource:
    url: ${DB_URL:jdbc:h2:mem:revivexdb;MODE=Oracle;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET:8a4b3d7c5f891e4b9d0f2a4c8e7b3d1f8a4b3d7c5f891e4b9d0f2a4c8e7b3d1f}
  expiration: 86400000

razorpay:
  key-id: ${RAZORPAY_KEY_ID:rzp_test_mock_id}
  key-secret: ${RAZORPAY_KEY_SECRET:mock_secret}

server:
  port: 8080
